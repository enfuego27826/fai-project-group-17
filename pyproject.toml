[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fai-team-comm"
version = "0.1.0"
description = "Exact values and learned communication in adversarial team games with finite channels"
requires-python = ">=3.11,<3.12"
dependencies = [
    "open_spiel>=1.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "gurobipy>=11",
    "pyyaml>=6",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["games", "eval", "solvers", "learning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: larger instances (Kuhn with k >= 1); deselect with -m 'not slow'"]
