# Milestone 7, task 2: combinations of two. The best single change in configs/m7_neural_diag.yaml
# was (e) PPO (mean g 0.708, 0 / 3 at target), then (a) entropy (0.437). PPO combined with each of the
# other four changes, same values, same cell (blocker n = 16, (4, 0, priv)), 3 seeds, 10,000 updates.
experiment: m7_neural_combo
seeds: [0, 1, 2]
workers: 5
iterations: 10000
batch: 256
lr: 1.0e-3
hidden: 64
log_every: 250
methods:
  - {name: ppo_entropy, opponent: best_response, ppo_epochs: 4, entropy: 0.05}
  - {name: ppo_batch1024, opponent: best_response, ppo_epochs: 4, batch: 1024}
  - {name: ppo_value, opponent: best_response, ppo_epochs: 4, value_baseline: true}
  - {name: ppo_hidden256, opponent: best_response, ppo_epochs: 4, hidden: 256}
cells:
  - [blocker16, 4, 0, priv]
