# Milestone 4, task 1: tune self-play's step size on one cell (blocker4 (2, 2, pub)), 3 seeds.
experiment: m4_tune_selfplay
seeds: [0, 1, 2]
workers: 8
exact_values_from: configs/m3_marl.yaml
methods:
  - {name: "self_play_lr0.5", trainer: pg, opponent: learning, lr: 0.5, iterations: 10000, batch: 256, outputs: [last, avg]}
  - {name: "self_play_lr1", trainer: pg, opponent: learning, lr: 1, iterations: 10000, batch: 256, outputs: [last, avg]}
  - {name: "self_play_lr2", trainer: pg, opponent: learning, lr: 2, iterations: 10000, batch: 256, outputs: [last, avg]}
  - {name: "self_play_lr4", trainer: pg, opponent: learning, lr: 4, iterations: 10000, batch: 256, outputs: [last, avg]}
  - {name: "self_play_lr8", trainer: pg, opponent: learning, lr: 8, iterations: 10000, batch: 256, outputs: [last, avg]}
games:
  - name: blocker4
    base_game: card_blocker(num_cards=4)
    team: [0, 1]
    adversary: 2
    rounds: [0]
    cells: [[2, 2, pub]]
